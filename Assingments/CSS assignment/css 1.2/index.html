<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
 <body>

    <div class="container">

        
        <div class="card login-card">

            <h2>Login</h2>

            <form>

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Confirm a password">
                    <i class="fa-regular fa-eye eye"></i>
                </div>

                <div class="options">

                    <label>
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>

                    <a href="#">Forgot password?</a>

                </div>

                <button type="submit">
                    Login Now
                </button>

                <p class="bottom-text">
                    Don't have an account?
                    <a href="#">Signup now</a>
                </p>

            </form>

        </div>


    
        <div class="card register-card">

            <h2>Registration</h2>

            <form>

                <div class="input-box">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Create a password">
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Confirm a password">
                    <i class="fa-regular fa-eye eye"></i>
                </div>

                <div class="terms">

                    <label>
                        <input type="checkbox">
                        <span>I accept all terms & conditions</span>
                    </label>

                </div>

                <button type="submit">
                    Register Now
                </button>

                <p class="bottom-text">
                    Already have an account?
                    <a href="#">Login now</a>
                </p>

            </form>

        </div>

    </div>

</body>
</html>
