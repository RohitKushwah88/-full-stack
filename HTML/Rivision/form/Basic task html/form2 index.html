<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h2>task 2</h2>

    
<fieldset>
  <legend align="center"></legend>

  <table align="left " border="1">
    <tr>
      <td align="left ">

        <h2>Pizza Order Form</h2>

        <form>

          <label for="firstname">First Name :</label>
          <input type="text" name="Firstname" id="firstname">

          <br><br>

          <label for="lastname">Last Name :</label>
          <input type="text" name="Lastname" id="lastname">

          <br><br>

          <label for="email">Email Address :</label>
          <input type="email" name="Email" id="email">

          <br><br>

          <label for="contact">Contact Number :</label>
          <input type="number" name="Contact" id="contact">

          <br><br>

          <label for="dob">Preferred Delivery Date :</label>
          <input type="date" name="dob" id="dob">

          <br><br>

          <label>Size :</label>

          <br><br>

          <input type="radio" name="order" value="small">
          Small

          <input type="radio" name="order" value="medium">
          Medium

          <input type="radio" name="order" value="large">
          Large

          <br><br>

          <label align="left" > Flavor :</label>

          <br><br>

          <input type="checkbox" name="flavor" value="Hawaiian" >
          Hawaiian (Php 150.00) 
          
          

          <br>

          <input type="checkbox" name="flavor" value="Pepperoni">
          Pepperoni (Php 140.00)
          <br>

          <input type="checkbox" name="flavor" value="Vegetable">
          Vegetable (Php 130.00)

          <br><br>

          <label for="card">Credit Card Number :</label>
          <input type="number" name="card" id="card">

          <br><br>

          <label for="pin">PIN :</label>
          <input type="number" name="pin" id="pin">

          <br><br>

          <label for="note">Additional Note :</label>

          <br><br>

          <textarea name="note" id="note"></textarea>

          <br><br>

          <button type="submit">Submit Order</button>

        </form>

      </td>
    </tr>
  </table>

</fieldset>

<button><a href="../../../Rivision/Main index.html"> Back to home page </a></button>
<button><a href="../Basic task html/form Assignment index.html" > Back to privious page </a></button>

</body>
</html>
