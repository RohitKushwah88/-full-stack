<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container border border-2 py-5 align-items-center">
      <div class="display-6">login Form</div>
      <div class="input-group p-2">
        <label> Your Name: </label>

        <input type="text" />
      </div>

      <div class="input-group p-2">
        <label> Phone: </label>
        <input type="number" />
      </div>

      <div class="input-group p-2">
        <label> Email: </label>
        <input type="email" />
      </div>
      <br />

      <button
        class="btn btn-success"
        type="button"
        data-bs-toggle="model"
        dta-bs-target="#changePasswordModel"
      >
        Change password
      </button>

      <div class="modal fade" id="PasswordModel" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title"  >change password</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              New Password
              <input type="text" />
            </div>
            <div class="modal-body">
              Comfirm Password
              <input type="text" />
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- BootStarp Script -->
    <script
      src="https://cdn.jsdel ivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
